name: Sync AI rules

on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'

permissions: {}

concurrency:
  group: sync-ai-rules
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test converter
        run: python3 -m unittest discover -s tests -v

      - name: Download and validate upstream rules
        run: python3 scripts/sync_rules.py

      - name: Commit only a changed rule file
        shell: bash
        run: |
          set -euo pipefail
          git add -- Ai.lsr
          if git diff --cached --quiet -- Ai.lsr; then
            echo 'Upstream rules are unchanged; no commit needed.'
            echo 'Sync succeeded. The rule file is unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync upstream AI rules' -- Ai.lsr
          git push
          echo 'Sync succeeded. Updated Ai.lsr and pushed the commit.' >> "$GITHUB_STEP_SUMMARY"
